openapi: 3.0.3
info:
  title: QUICKPATCH — Matching API
  version: 1.0.0
  description: |
    Contrato REST de Matching Service (DD V4, secciones 8.2.3, 8.3.5 y 8.3.6): localidades de Bogotá,
    disponibilidad y cobertura del técnico (RF-13, SCRUM-33) y ofertas de asignación (RF-10, SCRUM-30).

    - **Proveedor:** Matching Service (Java + Spring Boot).
    - **Consumidores:** app móvil Flutter (técnico) y API Gateway.
    - **Tenant:** se toma del claim `tenant_id` del JWT y el técnico del claim `sub`; nunca del cuerpo
      ni de la URL (RN-U3). Los datos de disponibilidad, cobertura y ofertas están aislados por tenant (RLS).
    - **Elegibilidad (RN-M9):** solo recibe ofertas un técnico `aprobado`, `disponible`, con la
      especialidad de la solicitud y con una localidad de cobertura que contiene la ubicación. Este contrato
      no expone el algoritmo; solo lo que el técnico consulta y responde.
    - Los errores se devuelven como `application/problem+json` (RFC 9457) con `correlationId`.
  contact:
    name: Equipo QUICKPATCH
    url: https://github.com/ARQUI-202630/quickpatch
servers:
  - url: https://quickpatch.internal/api
    description: Producción, detrás del API Gateway (VM1), que quita el prefijo /api
  - url: https://qa.quickpatch.internal/api
    description: Ambiente de QA (VM2, ADR-015)
tags:
  - name: localities
    description: Catálogo de referencia de las localidades de Bogotá.
  - name: availability
    description: Disponibilidad y cobertura del técnico autenticado.
  - name: offers
    description: Ofertas de asignación dirigidas al técnico autenticado.
security:
  - bearerAuth: []
paths:
  /v1/localities:
    get:
      tags: [localities]
      operationId: listLocalities
      summary: Listar las localidades de Bogotá
      description: |
        Devuelve las 20 localidades de Bogotá D.C. (R6), ordenadas por código, sin su polígono (DD 5.18).
        Es un catálogo de referencia igual para todos los tenants, por eso no requiere token.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Localidades de Bogotá.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Locality'
  /v1/technicians/me/availability:
    get:
      tags: [availability]
      operationId: getMyAvailability
      summary: Consultar la disponibilidad del técnico autenticado
      description: Solo el rol `tecnico`. El estado inicial, al registrarse, es `no_disponible` (DD 5.6).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Disponibilidad actual.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TechnicianNotFound'
    put:
      tags: [availability]
      operationId: updateMyAvailability
      summary: Cambiar la disponibilidad del técnico autenticado
      description: |
        Cambia entre `disponible` y `no_disponible` (RF-13). El estado `ocupado` solo lo fija Matching al
        aceptar una oferta (RN-M6): si el técnico está `ocupado`, responde `409 transicion-invalida`.
        Pasar a `disponible` reintenta las solicitudes en espera (RN-M10), lo que puede publicar
        `matching.search-resumed`. Repetir el estado actual no es un error.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAvailabilityRequest'
            example:
              status: disponible
      responses:
        '200':
          description: Disponibilidad con el estado nuevo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TechnicianNotFound'
        '409':
          description: El técnico está `ocupado` con un servicio (`problems/transicion-invalida`, RN-M6).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/technicians/me/coverage:
    get:
      tags: [availability]
      operationId: getMyCoverage
      summary: Consultar las localidades que cubre el técnico autenticado
      description: Solo el rol `tecnico`. Un técnico sin cobertura devuelve la lista vacía.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Cobertura actual.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TechnicianNotFound'
    put:
      tags: [availability]
      operationId: replaceMyCoverage
      summary: Reemplazar las localidades que cubre el técnico autenticado
      description: |
        Reemplaza la lista completa de localidades (RF-13, DD 8.3.6). Una lista vacía o un código que no existe
        responde `400 validacion`. Cambiar la cobertura reintenta las solicitudes en espera (RN-M10).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCoverageRequest'
            example:
              localityCodes: ['02', '12', '13']
      responses:
        '200':
          description: Cobertura con las localidades nuevas.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TechnicianNotFound'
  /v1/matching/offers:
    get:
      tags: [offers]
      operationId: listMyOffers
      summary: Consultar las ofertas pendientes del técnico autenticado
      description: |
        Solo el rol `tecnico`, y solo sus propias ofertas (RN-M2). Como un técnico tiene a lo sumo una oferta
        pendiente a la vez (RN-M7), `items` tiene cero o un elemento. La oferta muestra la localidad y la
        distancia, nunca la dirección exacta: la dirección solo la recibe el técnico asignado (RN-SR13,
        SCRUM-30 criterio 1).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          description: Estado de las ofertas. En esta versión solo se consultan las pendientes.
          schema:
            type: string
            enum: [pendiente]
            default: pendiente
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Ofertas pendientes del técnico.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/matching/offers/{attemptId}/accept:
    post:
      tags: [offers]
      operationId: acceptOffer
      summary: Aceptar una oferta
      description: |
        El técnico acepta la oferta pendiente que se le dirigió, antes de `expiresAt` (RN-M2, RN-M8). Al
        aceptar pasa a `ocupado` (RN-M6) y Matching publica `matching.technician-assigned` (RN-M4).

        Una oferta inexistente, dirigida a otro técnico, ya respondida, vencida o cancelada responde
        `409 oferta-no-disponible` (SCRUM-30, criterio 5). Se usa la misma respuesta para la oferta
        inexistente y la ajena, para no revelar las ofertas de otros técnicos. Si el técnico dejó de estar
        `disponible` antes de aceptar, responde `409 tecnico-no-disponible` (RN-M7).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Oferta aceptada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
              example:
                attemptId: 2d4f6a8c-1111-4b22-9c33-444455556666
                response: aceptado
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            La oferta no está disponible (`problems/oferta-no-disponible`) o el técnico ya no está disponible
            (`problems/tecnico-no-disponible`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/matching/offers/{attemptId}/reject:
    post:
      tags: [offers]
      operationId: rejectOffer
      summary: Rechazar una oferta
      description: |
        El técnico rechaza la oferta pendiente que se le dirigió, sin penalización (RF-10, R12). Matching ofrece
        la solicitud al siguiente candidato elegible (RN-M3) o, si no queda ninguno, publica
        `matching.no-technician-available`. Una oferta inexistente, ajena, ya respondida, vencida o cancelada
        responde `409 oferta-no-disponible`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Oferta rechazada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
              example:
                attemptId: 2d4f6a8c-1111-4b22-9c33-444455556666
                response: rechazado
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: La oferta no está disponible (`problems/oferta-no-disponible`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por Identity con los claims `sub`, `tenant_id` y `role` (ADR-018).
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Si no llega, el servicio genera uno y lo devuelve.
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      description: Identificador de la oferta (`matching_attempts.id`).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Página, desde 1 (DD 8.1).
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: Elementos por página, máximo 100 (DD 8.1).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    CorrelationId:
      description: Identificador de correlación de la petición.
      schema:
        type: string
        format: uuid
  schemas:
    Locality:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          maxLength: 10
          description: Código oficial de la localidad, por ejemplo `02` para Chapinero.
        name:
          type: string
          maxLength: 60
    AvailabilityStatus:
      type: string
      description: Disponibilidad del técnico (DD 5.6).
      enum: [disponible, no_disponible, ocupado]
    Availability:
      type: object
      required: [status, updatedAt]
      properties:
        status:
          $ref: '#/components/schemas/AvailabilityStatus'
        updatedAt:
          type: string
          format: date-time
    UpdateAvailabilityRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          description: El técnico solo puede elegir entre estos dos estados; `ocupado` lo fija Matching.
          enum: [disponible, no_disponible]
    Coverage:
      type: object
      required: [localities]
      properties:
        localities:
          type: array
          items:
            $ref: '#/components/schemas/Locality'
    ReplaceCoverageRequest:
      type: object
      required: [localityCodes]
      additionalProperties: false
      properties:
        localityCodes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Códigos de las localidades que cubre el técnico; todos deben existir en `/v1/localities`.
          items:
            type: string
            maxLength: 10
    Offer:
      type: object
      required: [attemptId, serviceRequestId, categoryId, description, locality, distanceMeters, offeredAt, expiresAt]
      properties:
        attemptId:
          type: string
          format: uuid
        serviceRequestId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          description: Categoría de la solicitud (Catalog).
        categoryName:
          type: string
          nullable: true
          description: Nombre de la categoría según la réplica de Matching (`catalog.category-changed`); `null` si todavía no llegó.
        description:
          type: string
          description: Descripción del problema que escribió el cliente.
        locality:
          $ref: '#/components/schemas/Locality'
        distanceMeters:
          type: number
          format: double
          minimum: 0
          description: Distancia entre el técnico y la ubicación de la solicitud al momento de la oferta.
        offeredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: '`offeredAt` + 3 minutos (`MATCHING_OFFER_TTL`, RN-M8).'
    OfferPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    OfferResponse:
      type: object
      required: [attemptId, response]
      properties:
        attemptId:
          type: string
          format: uuid
        response:
          type: string
          enum: [aceptado, rechazado]
    Problem:
      type: object
      description: Detalle de error según RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: object
          description: Errores de validación por campo.
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Unauthenticated:
      description: Falta el JWT o es inválido o expiró (`problems/no-autenticado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El rol del token no es `tecnico` (`problems/no-autorizado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Datos de entrada inválidos (`problems/validacion`), con `errors` por campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TechnicianNotFound:
      description: |
        Matching todavía no tiene la disponibilidad del técnico porque no ha procesado su
        `technician.registered` (`problems/no-encontrado`). El técnico puede reintentar segundos después.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
