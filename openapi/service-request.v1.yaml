openapi: 3.0.3
info:
  title: QUICKPATCH — ServiceRequest API
  version: 1.5.0
  description: |
    Contrato REST de ServiceRequest Service (DD, sección 8.1).

    **1.1.0** (compatible): el técnico asignado consulta el detalle de la solicitud (RF-14, SCRUM-34,
    DD V4 8.3.4) y la respuesta agrega los campos opcionales `assignedAt`, `technician` y `client`. No
    cambia nada de lo que ya recibía el cliente.

    **1.2.0** (compatible): el técnico lista las solicitudes que tiene asignadas
    (`GET /v1/technicians/me/service-requests`, RF-17, SCRUM-464), sin datos de contacto (RN-SR13).

    **1.3.0** (compatible): la solicitud se puede crear sin `location` si llega `addressText`. ServiceRequest
    geocodifica la dirección dentro de Bogotá con su Nominatim propio (ADR-024, RIE-02) y, si no la encuentra,
    responde `422 direccion-no-encontrada` para que la app le pida al cliente compartir su ubicación.
    Agrega `POST /v1/service-requests/location-preview`: con solo la dirección devuelve el punto, la localidad
    y la dirección que reconoció el geocodificador, para que el cliente confirme o corrija antes de crear la
    solicitud (Nominatim no usa el número de casa).

    **1.4.0** (compatible): panel operativo de solicitudes (RF-18, SCRUM-38). El `admin_tenant` lista las
    solicitudes de su tenant (`GET /v1/service-requests`) y consulta los conteos por estado
    (`GET /v1/admin/service-requests/summary`). El `admin_plataforma` consulta solo los conteos de cada tenant
    (`GET /v1/platform/service-requests/summary`), sin ver solicitudes ni datos de los clientes (DD 10.4, DEP-15).
    El panel consulta como máximo una vez por minuto.

    **1.5.0** (compatible): cancelación antes de iniciar el servicio (RF-36, SCRUM-472). El cliente dueño y el
    `admin_tenant` cancelan con `POST /v1/service-requests/{id}/cancel` y un motivo obligatorio; desde
    `en_progreso` responde `409 transicion-invalida` (RN-SR7). ServiceRequest publica `service-request.cancelled`
    y `service-request.status-changed` (quickpatch-kafka v0.5.0). El detalle agrega `cancelledAt` y
    `cancellationReason`, opcionales.

    - **Proveedor:** ServiceRequest Service.
    - **Consumidores:** app móvil (cliente y técnico), panel web (administradores, desde 1.4.0) y API Gateway.
    - El tenant y el cliente se toman de los claims del JWT (`tenant_id`, `sub`); nunca del cuerpo de la petición.
    - Los errores se devuelven como `application/problem+json` (RFC 9457).
  contact:
    name: Equipo QUICKPATCH
    url: https://github.com/ARQUI-202630/quickpatch
servers:
  - url: https://quickpatch.internal/api
    description: Producción, detrás del API Gateway (VM1), que quita el prefijo /api
  - url: https://qa.quickpatch.internal/api
    description: Ambiente de QA (VM2, ADR-015)
tags:
  - name: service-requests
    description: Solicitudes de servicio técnico.
  - name: technicians
    description: Solicitudes vistas por el técnico.
  - name: admin
    description: Panel operativo del administrador del tenant (desde 1.4.0).
  - name: platform
    description: Conteos de todos los tenants para el administrador de plataforma (desde 1.4.0).
security:
  - bearerAuth: []
paths:
  /v1/service-requests:
    get:
      tags: [admin]
      operationId: listServiceRequests
      summary: Listar las solicitudes del tenant (administrador del tenant)
      description: |
        Solicitudes del tenant del token, de la más reciente a la más antigua (RF-18, SCRUM-38). Desde 1.4.0
        solo el rol `admin_tenant`; la lista del cliente (DD 8.2.4) llegará en otra versión.

        No trae la dirección, la ubicación ni los datos de contacto: el panel opera la solicitud por su
        estado y sus identificadores. Una solicitud de otro tenant nunca aparece (RLS, RF-04).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          description: Filtra por estado. Sin el parámetro devuelve todas.
          schema:
            $ref: '#/components/schemas/ServiceRequestStatus'
        - name: page
          in: query
          required: false
          description: Página, desde 1 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Elementos por página, máximo 100 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Solicitudes del tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceRequestPage'
              example:
                items:
                  - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    status: asignado
                    categoryId: 3f1c2a4e-8d7b-4c1a-9e2f-5b6a7c8d9e01
                    clientId: 2b8f6c1e-4d3a-4e5b-9c7d-1a2b3c4d5e6f
                    technicianId: 9d1e2f3a-4b5c-4d6e-8f7a-0b1c2d3e4f5a
                    createdAt: '2026-10-14T15:02:11Z'
                    assignedAt: '2026-10-14T15:04:40Z'
                page: 1
                size: 20
                totalItems: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [service-requests]
      operationId: createServiceRequest
      summary: Crear una solicitud de servicio
      description: |
        Crea una solicitud en estado `buscando_tecnico` (RF-07) y publica el evento
        `service-request.created` mediante Outbox (ADR-007). Solo el rol `cliente` puede crearla.

        Reglas: la categoría debe existir y estar activa en el tenant del usuario (RN-SR10) y la
        ubicación debe estar dentro del área de cobertura de Bogotá D.C. (RN-SR1, RN-SR9).

        **Ubicación (1.3.0, ADR-024).** Las coordenadas del GPS son la primera opción: si llega `location`,
        se usa tal cual y `addressText` solo complementa. Si no llega, ServiceRequest geocodifica
        `addressText` con el Nominatim propio, que solo tiene el mapa de Bogotá (RIE-02, R6), antes de
        guardar la solicitud. Si no encuentra la dirección, o el geocodificador no responde a tiempo,
        responde `422 direccion-no-encontrada` y no crea nada; la app le pide al cliente compartir su
        ubicación y reintenta. La dirección nunca sale de la infraestructura del laboratorio (K12).

        **Flujo recomendado sin GPS:** la app llama primero a `POST /v1/service-requests/location-preview`,
        muestra el punto y la localidad, el cliente confirma o mueve el pin, y la solicitud se crea **con**
        `location`. Geocodificar al crear queda como respaldo.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
            examples:
              conUbicacion:
                summary: Con la ubicación del teléfono
                value:
                  categoryId: 3f1c2a4e-8d7b-4c1a-9e2f-5b6a7c8d9e01
                  description: Fuga de agua debajo del lavaplatos de la cocina.
                  location:
                    latitude: 4.6486
                    longitude: -74.063
                  addressText: Calle 63 # 9-45, apartamento 502, Chapinero
              soloDireccion:
                summary: Solo con la dirección (1.3.0); ServiceRequest la geocodifica
                value:
                  categoryId: 3f1c2a4e-8d7b-4c1a-9e2f-5b6a7c8d9e01
                  description: Fuga de agua debajo del lavaplatos de la cocina.
                  addressText: Calle 63 # 9-45, apartamento 502, Chapinero
      responses:
        '201':
          description: Solicitud creada.
          headers:
            Location:
              description: URL de la solicitud creada.
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
  /v1/service-requests/location-preview:
    post:
      tags: [service-requests]
      operationId: previewServiceRequestLocation
      summary: Vista previa de la ubicación de una dirección
      description: |
        Geocodifica una dirección escrita dentro de Bogotá con el Nominatim propio (ADR-024, RIE-02) y
        devuelve el punto, la localidad y la dirección que reconoció, **sin crear nada**. Sirve para que el
        cliente confirme dónde quedó antes de crear la solicitud: Nominatim no usa el número de casa (ubica
        la calle o el barrio), así que el punto puede caer en otra localidad, y la localidad decide qué
        técnicos cubren la solicitud (RN-M9). Si el punto no es el correcto, la app deja mover el pin y
        envía ese `location` al crear.

        Es `POST` para que la dirección no quede en la URL ni en los logs del gateway (K12). Solo los roles
        que crean solicitudes (`cliente`, `empresa_contacto`).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPreviewRequest'
            example:
              addressText: Calle 63 # 9-45, apartamento 502, Chapinero
      responses:
        '200':
          description: Dirección encontrada dentro de Bogotá.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPreview'
              example:
                location:
                  latitude: 4.6486
                  longitude: -74.063
                locality:
                  code: '02'
                  name: Chapinero
                matchedAddress: Calle 63, Chapinero, Bogotá
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            `direccion-no-encontrada`: el geocodificador no encontró la dirección o no respondió a tiempo.
            `ubicacion-fuera-de-cobertura`: el punto quedó fuera del área de cobertura o de las 20
            localidades (RN-SR9). En los dos casos la app le pide al cliente compartir su ubicación.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/service-requests/{id}:
    get:
      tags: [service-requests]
      operationId: getServiceRequest
      summary: Consultar una solicitud
      description: |
        Devuelve la solicitud si pertenece al tenant del usuario autenticado y el usuario es su
        cliente o su técnico asignado. Una solicitud de otro tenant, de otro cliente o asignada a otro
        técnico responde `404`, para no revelar su existencia.

        **Cliente dueño:** recibe la solicitud completa; `technician` aparece desde `asignado` y `client`
        siempre es `null`.

        **Técnico asignado** (1.1.0): solo mientras la solicitud está entre `asignado` y `completado`
        (RN-SR13). Recibe la dirección, la ubicación y el bloque `client` con el nombre y el teléfono del
        cliente. Antes de aceptar, el técnico solo ve la localidad y la distancia en la oferta (Matching).
        Fuera de ese rango de estados responde `403`, para no entregar la dirección ni el contacto
        (SCRUM-34, criterio 2).

        Los nombres y el teléfono se obtienen de Identity; si Identity no responde, `technician` y `client`
        llegan con `fullName` y `phone` en `null`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: Identificador de la solicitud.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Solicitud encontrada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            El rol no puede consultar solicitudes, o el técnico asignado la consulta fuera del rango
            `asignado`–`completado` (`problems/no-autorizado`, RN-SR13).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/service-requests/{id}/cancel:
    post:
      tags: [service-requests]
      operationId: cancelServiceRequest
      summary: Cancelar una solicitud antes de iniciar el servicio
      description: |
        Cancela la solicitud con un motivo obligatorio (RF-36, DD 8.3.9). Desde 1.5.0.

        - **Quién:** el `cliente` que la creó, o el `admin_tenant` de su tenant (RN-SR8). Una solicitud de otro
          cliente o de otro tenant responde `404`, para no revelar su existencia. Otro rol responde `403`.
        - **Cuándo:** desde `buscando_tecnico`, `en_espera`, `asignado`, `cotizado` o `cotizacion_aceptada`.
          Desde `en_progreso`, `completado`, `pagado` o `cancelado` responde `409 transicion-invalida` (RN-SR7).
        - **Efectos:** guarda `cancelledAt`, el motivo y quién canceló; publica `service-request.cancelled`,
          para que Matching retire la oferta pendiente y libere al técnico (RN-M5, RN-M6), y
          `service-request.status-changed`, para el aviso en tiempo real al cliente, al técnico asignado y al
          panel. La cancelación de un `admin_tenant` queda en la auditoría (`cancelar_solicitud_admin`).
        - El motivo es un dato del usuario: no se escribe en los logs.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: Identificador de la solicitud.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelServiceRequest'
            example:
              reason: Ya no necesito el servicio.
      responses:
        '200':
          description: Solicitud cancelada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledServiceRequest'
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                status: cancelado
                cancelledAt: '2026-10-18T16:20:00Z'
                cancelledByType: cliente
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /v1/technicians/me/service-requests:
    get:
      tags: [technicians]
      operationId: listTechnicianServiceRequests
      summary: Listar las solicitudes asignadas al técnico
      description: |
        Solicitudes cuyo técnico asignado es el usuario autenticado, en el tenant del token, de la
        asignación más reciente a la más antigua (RF-17). Solo el rol `tecnico`. Desde 1.2.0.

        No trae dirección, ubicación ni datos del cliente (RN-SR13): el detalle, con el contacto
        mientras la solicitud está entre `asignado` y `completado`, sigue en `GET /v1/service-requests/{id}`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          description: Filtra por estado. Sin el parámetro devuelve todas.
          schema:
            $ref: '#/components/schemas/ServiceRequestStatus'
        - name: page
          in: query
          required: false
          description: Página, desde 1 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Elementos por página, máximo 100 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Solicitudes asignadas al técnico.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianServiceRequestPage'
              example:
                items:
                  - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    status: asignado
                    categoryId: 3f1c2a4e-8d7b-4c1a-9e2f-5b6a7c8d9e01
                    description: Fuga de agua debajo del lavaplatos de la cocina.
                    createdAt: '2026-10-14T15:02:11Z'
                    assignedAt: '2026-10-14T15:04:40Z'
                page: 1
                size: 20
                totalItems: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/service-requests/summary:
    get:
      tags: [admin]
      operationId: getServiceRequestSummary
      summary: Conteo de solicitudes por estado del tenant
      description: |
        Cuántas solicitudes del tenant del token hay en cada uno de los 9 estados y cuántas se crearon hoy
        (RF-18, SCRUM-38; DD 8.3.15). Solo el rol `admin_tenant`; cuenta bajo RLS, así que nunca incluye
        otro tenant. Los 9 estados siempre vienen, con 0 si no hay solicitudes. «Hoy» es el día calendario de
        Bogotá (UTC-5). Desde 1.4.0.

        El panel lo consulta como máximo una vez por minuto (SCRUM-38, criterio 3).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Conteos del tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestSummary'
              example:
                generatedAt: '2026-10-18T16:00:00Z'
                byStatus:
                  buscando_tecnico: 4
                  en_espera: 1
                  asignado: 6
                  cotizado: 0
                  cotizacion_aceptada: 0
                  en_progreso: 0
                  completado: 0
                  pagado: 0
                  cancelado: 2
                createdToday: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/platform/service-requests/summary:
    get:
      tags: [platform]
      operationId: getPlatformServiceRequestSummary
      summary: Conteo de solicitudes por estado de cada tenant
      description: |
        Los mismos conteos de `GET /v1/admin/service-requests/summary`, uno por tenant, para el
        `admin_plataforma` (RF-18, SCRUM-38; DD 10.4, DEP-15). Solo conteos: no devuelve solicitudes,
        identificadores de usuarios ni datos de los clientes. Desde 1.4.0.

        Es una operación de plataforma: ServiceRequest la resuelve con el rol `service_request_platform`
        (`BYPASSRLS`, solo `SELECT` sobre `tenant_id`, `status` y `created_at`) y deja cada consulta en el
        log estructurado con el usuario y el filtro. Un tenant sin solicitudes no aparece en `tenants`; los
        nombres de los tenants salen de `GET /v1/platform/tenants` (Identity).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: tenantId
          in: query
          required: false
          description: Solo los conteos de este tenant. Sin el parámetro, todos los tenants.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conteos por tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformServiceRequestSummary'
              example:
                generatedAt: '2026-10-18T16:00:00Z'
                tenants:
                  - tenantId: 5f0c2d8e-1a3b-4c5d-9e6f-7a8b9c0d1e2f
                    byStatus:
                      buscando_tecnico: 4
                      en_espera: 1
                      asignado: 6
                      cotizado: 0
                      cotizacion_aceptada: 0
                      en_progreso: 0
                      completado: 0
                      pagado: 0
                      cancelado: 2
                    createdToday: 5
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por Identity Service con los claims `sub`, `tenant_id` y `role`.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Si no llega, el servicio genera uno y lo devuelve.
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      description: Identificador de correlación de la petición.
      schema:
        type: string
        format: uuid
  schemas:
    GeoPoint:
      type: object
      description: Punto geográfico en WGS 84 (SRID 4326).
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    CreateServiceRequest:
      type: object
      required: [categoryId, description, addressText]
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
          description: Categoría del catálogo del tenant (Catalog Service).
        description:
          type: string
          minLength: 10
          maxLength: 1000
          description: Descripción del problema que el técnico debe atender.
        location:
          # Opcional desde 1.3.0: sin ella, ServiceRequest geocodifica addressText dentro de Bogotá (ADR-024).
          $ref: '#/components/schemas/GeoPoint'
        addressText:
          type: string
          minLength: 5
          maxLength: 255
          description: |
            Dirección escrita con los datos que el punto geográfico no tiene (torre,
            apartamento, indicaciones). La ubicación sirve para el matching; la dirección, para
            que el técnico llegue. Sin `location`, es lo que se geocodifica: debe incluir la
            nomenclatura de la calle (por ejemplo, `Calle 63 # 9-45`).
    LocationPreviewRequest:
      type: object
      required: [addressText]
      additionalProperties: false
      properties:
        addressText:
          type: string
          minLength: 5
          maxLength: 255
          description: La misma dirección que se enviará al crear la solicitud.
    LocationPreview:
      type: object
      required: [location, locality, matchedAddress]
      properties:
        location:
          $ref: '#/components/schemas/GeoPoint'
        locality:
          $ref: '#/components/schemas/Locality'
        matchedAddress:
          type: string
          description: |
            Lo que reconoció el geocodificador (calle, barrio o localidad), para que el cliente compruebe que es
            su dirección. No incluye el número de casa cuando Nominatim no lo encontró.
    Locality:
      type: object
      description: Localidad de Bogotá que contiene el punto; los mismos códigos de `GET /v1/localities` (Matching).
      required: [code, name]
      properties:
        code:
          type: string
          example: '02'
        name:
          type: string
          example: Chapinero
    ServiceRequestStatus:
      type: string
      description: Estado de la solicitud (DD, sección 7.4).
      enum:
        - buscando_tecnico
        - en_espera
        - asignado
        - cotizado
        - cotizacion_aceptada
        - en_progreso
        - completado
        - pagado
        - cancelado
    ServiceRequest:
      type: object
      required: [id, status, categoryId, description, location, addressText, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        categoryId:
          type: string
          format: uuid
        technicianId:
          type: string
          format: uuid
          nullable: true
          description: Técnico asignado; `null` mientras no haya asignación (RN-SR2).
        description:
          type: string
        location:
          $ref: '#/components/schemas/GeoPoint'
        addressText:
          type: string
        createdAt:
          type: string
          format: date-time
        assignedAt:
          type: string
          format: date-time
          nullable: true
          description: Momento en que un técnico aceptó la oferta (`matching.technician-assigned`); `null` antes. Desde 1.1.0.
        technician:
          allOf:
            - $ref: '#/components/schemas/AssignedTechnician'
          nullable: true
          description: Técnico asignado; `null` mientras no haya asignación. Desde 1.1.0.
        client:
          allOf:
            - $ref: '#/components/schemas/RequestClient'
          nullable: true
          description: Contacto del cliente; solo para el técnico asignado entre `asignado` y `completado` (RN-SR13), `null` para el cliente. Desde 1.1.0.
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: Momento de la cancelación; `null` si no se canceló. Desde 1.5.0.
        cancellationReason:
          type: string
          nullable: true
          description: Motivo de la cancelación (RF-36); `null` si no se canceló. Desde 1.5.0.
    AssignedTechnician:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
    RequestClient:
      type: object
      required: [id, fullName, phone]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
    TechnicianServiceRequest:
      type: object
      description: Solicitud en la lista del técnico, sin dirección, ubicación ni cliente (RN-SR13). Desde 1.2.0.
      required: [id, status, categoryId, description, createdAt, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        categoryId:
          type: string
          format: uuid
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        assignedAt:
          type: string
          format: date-time
    TechnicianServiceRequestPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TechnicianServiceRequest'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    AdminServiceRequest:
      type: object
      description: Solicitud en la lista del administrador del tenant, sin dirección, ubicación ni contacto. Desde 1.4.0.
      required: [id, status, categoryId, clientId, technicianId, createdAt, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        categoryId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
          description: Cliente que creó la solicitud.
        technicianId:
          type: string
          format: uuid
          nullable: true
          description: Técnico asignado; `null` mientras no haya asignación.
        createdAt:
          type: string
          format: date-time
        assignedAt:
          type: string
          format: date-time
          nullable: true
    AdminServiceRequestPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminServiceRequest'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    StatusCounts:
      type: object
      description: Cantidad de solicitudes en cada estado (DD 7.4); siempre trae los 9, con 0 si no hay. Desde 1.4.0.
      required: [buscando_tecnico, en_espera, asignado, cotizado, cotizacion_aceptada, en_progreso, completado, pagado, cancelado]
      additionalProperties: false
      properties:
        buscando_tecnico: { type: integer, minimum: 0 }
        en_espera: { type: integer, minimum: 0 }
        asignado: { type: integer, minimum: 0 }
        cotizado: { type: integer, minimum: 0 }
        cotizacion_aceptada: { type: integer, minimum: 0 }
        en_progreso: { type: integer, minimum: 0 }
        completado: { type: integer, minimum: 0 }
        pagado: { type: integer, minimum: 0 }
        cancelado: { type: integer, minimum: 0 }
    ServiceRequestSummary:
      type: object
      description: Conteos del tenant del administrador. Desde 1.4.0.
      required: [generatedAt, byStatus, createdToday]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: Momento del cálculo.
        byStatus:
          $ref: '#/components/schemas/StatusCounts'
        createdToday:
          type: integer
          minimum: 0
          description: Solicitudes creadas hoy, día calendario de Bogotá (UTC-5).
    TenantServiceRequestSummary:
      type: object
      required: [tenantId, byStatus, createdToday]
      properties:
        tenantId:
          type: string
          format: uuid
        byStatus:
          $ref: '#/components/schemas/StatusCounts'
        createdToday:
          type: integer
          minimum: 0
    PlatformServiceRequestSummary:
      type: object
      description: Conteos de cada tenant con solicitudes, para el administrador de plataforma. Desde 1.4.0.
      required: [generatedAt, tenants]
      properties:
        generatedAt:
          type: string
          format: date-time
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantServiceRequestSummary'
    CancelServiceRequest:
      type: object
      description: Cuerpo de la cancelación (RF-36). Desde 1.5.0.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: Motivo de la cancelación, sin espacios al inicio ni al final.
    CancelledServiceRequest:
      type: object
      description: Resultado de la cancelación (DD 8.3.9). Desde 1.5.0.
      required: [id, status, cancelledAt, cancelledByType]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [cancelado]
        cancelledAt:
          type: string
          format: date-time
        cancelledByType:
          type: string
          enum: [cliente, admin_tenant]
          description: Quién canceló (RN-SR8). `sistema` solo aparece en el evento (RN-Q6, RN-Q7).
    Problem:
      type: object
      description: Detalle de error según RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identificador del tipo de error.
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          format: uuid
        errors:
          type: object
          description: Errores de validación por campo.
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    ValidationError:
      description: Datos de entrada inválidos (campos faltantes, formatos o rangos).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://quickpatch.internal/problems/validacion
            title: La solicitud tiene datos inválidos
            status: 400
            correlationId: 9b2e4f6a-1c3d-4e5f-8a7b-6c5d4e3f2a10
            errors:
              description: [La descripción debe tener entre 10 y 1000 caracteres.]
    Unauthorized:
      description: Falta el JWT o es inválido o expiró.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El rol del usuario no puede ejecutar la operación (por ejemplo, un `admin_tenant` en la ruta de plataforma).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: La solicitud no existe o no pertenece al usuario.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidTransition:
      description: |
        El estado actual de la solicitud no admite la acción (`problems/transicion-invalida`): por ejemplo,
        cancelar desde `en_progreso`, `completado`, `pagado` o `cancelado` (RN-SR7). Desde 1.5.0.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://quickpatch.internal/problems/transicion-invalida
            title: La solicitud ya no se puede cancelar
            status: 409
            detail: El servicio ya inició.
    BusinessRuleViolation:
      description: |
        Los datos son válidos pero violan una regla de negocio:
        `categoria-no-disponible` (RN-SR10), `ubicacion-fuera-de-cobertura` (RN-SR9) o, desde 1.3.0,
        `direccion-no-encontrada` (la solicitud llegó sin `location` y la dirección no se pudo
        geocodificar dentro de Bogotá, ADR-024).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            fueraDeCobertura:
              value:
                type: https://quickpatch.internal/problems/ubicacion-fuera-de-cobertura
                title: La ubicación está fuera del área de cobertura
                status: 422
                detail: El servicio opera solo en Bogotá D.C.
            direccionNoEncontrada:
              value:
                type: https://quickpatch.internal/problems/direccion-no-encontrada
                title: No encontramos la dirección
                status: 422
                detail: Comparte tu ubicación para crear la solicitud.
