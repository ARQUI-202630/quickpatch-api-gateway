openapi: 3.0.3
info:
  title: QUICKPATCH — Communication API
  version: 1.3.0
  description: |
    Contrato REST de Communication Service: el **buzón de notificaciones** dentro de la app (RIE-03,
    ADR-024, SCRUM-455). Complementa el canal en tiempo real (`asyncapi/realtime.v1.yaml`, ADR-023): el
    canal avisa al instante si la app está abierta, y el buzón guarda lo que pasó para que el usuario lo vea
    aunque no la tuviera abierta. El correo y las notificaciones push con la app cerrada quedan fuera del MVP.

    - **Proveedor:** Communication Service, que crea cada notificación al consumir los eventos de Kafka
      (tabla de tipos en `Notification.type`). Ninguna app crea notificaciones.
    - **Consumidores:** app móvil Flutter (cliente, `empresa_contacto` y técnico) y API Gateway.
    - **Usuario y tenant:** salen de los claims `sub` y `tenant_id` del JWT (RN-U3). Cada usuario ve solo
      sus notificaciones; las de otro usuario u otro tenant responden `404`, para no revelar que existen.
    - **Texto:** Communication arma `title` y `message` en español a partir del evento. No incluyen la
      dirección ni el teléfono de nadie (RN-SR13): para el detalle, la app consulta el recurso por REST.
    - Los errores se devuelven como `application/problem+json` (RFC 9457) con `correlationId`.

    **1.1.0 (SCRUM-472):** tipo `solicitud-cancelada`. Los avisos de estado salen de
    `service-request.status-changed` (SCRUM-466) y no de los eventos de Matching. Cambio compatible: solo agrega un
    valor a `NotificationType`, que pasa a `x-extensible-enum` porque la app ignora los tipos que no conoce.

    **1.2.0 (SCRUM-487):** tipos `cotizacion-recibida`, `cotizacion-aceptada` y `cotizacion-rechazada`, que salen de los
    eventos de la cotización (quickpatch-kafka v0.6.0). `tecnico-asignado` y `solicitud-asignada` quedan solo para la
    llegada a `asignado` desde `buscando_tecnico`: el regreso a `asignado` al rechazar una cotización no los repite.

    **1.3.0 (SCRUM-479, ADR-026):** chat de la solicitud entre el cliente dueño y el técnico asignado (RF-37):
    `GET` y `POST /v1/service-requests/{id}/messages`. Es una excepción de ADR-025: la ruta empieza por
    `/v1/service-requests/{id}` porque nombra la solicitud, pero la atiende Communication (un `IngressRoute` de Traefik
    la toma por el sufijo `/messages`). Cada mensaje nuevo también llega al otro participante por el canal en tiempo
    real (trama `chat.message`, `realtime.v1.yaml` 1.1.0). Cambio compatible: solo agrega rutas y esquemas.
  contact:
    name: Equipo QUICKPATCH
    url: https://github.com/ARQUI-202630/quickpatch
servers:
  - url: https://quickpatch.internal/api
    description: Producción, detrás del API Gateway (VM1), que quita el prefijo /api
  - url: https://qa.quickpatch.internal/api
    description: Ambiente de QA (VM2, ADR-015)
tags:
  - name: notifications
    description: Buzón de notificaciones del usuario autenticado.
  - name: chat
    description: Chat de la solicitud entre el cliente dueño y el técnico asignado (1.3.0).
security:
  - bearerAuth: []
paths:
  /v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Listar las notificaciones del usuario
      description: |
        Devuelve las notificaciones del usuario del token, de la más reciente a la más antigua, y cuántas
        tiene sin leer (`unreadCount`, para el contador de la app). Con `unread=true` devuelve solo las no
        leídas. Roles admitidos: `cliente`, `empresa_contacto`, `tecnico` y `admin_tenant`; los demás
        responden `403`.

        Cuando la app recibe un aviso por el canal en tiempo real, puede volver a pedir esta lista para
        actualizar el contador.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: unread
          in: query
          required: false
          description: '`true`: solo las no leídas. Sin el parámetro, todas.'
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Notificaciones del usuario.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                items:
                  - id: 0190f3b4-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    type: tecnico-asignado
                    title: Ya tienes técnico
                    message: Un técnico aceptó tu solicitud y va a ponerse en contacto contigo.
                    serviceRequestId: 9a7b6c5d-1e2f-4a3b-8c7d-6e5f4a3b2c1d
                    createdAt: '2026-10-12T16:10:00Z'
                    readAt: null
                page: 1
                size: 20
                totalItems: 1
                unreadCount: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Marcar una notificación como leída
      description: |
        Marca la notificación como leída y la devuelve. Es idempotente: si ya estaba leída, conserva el
        `readAt` original y responde `200`. Una notificación de otro usuario o de otro tenant, o que no
        existe, responde `404`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: Identificador de la notificación.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notificación leída.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/service-requests/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        description: Solicitud del chat.
        schema:
          type: string
          format: uuid
    get:
      tags: [chat]
      operationId: listServiceRequestMessages
      summary: Historial del chat de la solicitud
      description: |
        Mensajes del chat, del más reciente al más antiguo, y `writable`, que dice si se puede escribir
        (DD RN-CH2): con técnico asignado y en `asignado`, `cotizado`, `cotizacion_aceptada` o `en_progreso`.
        En `completado`, `pagado` y `cancelado` el historial se puede leer pero no escribir.

        Solo participan el cliente dueño (o el `empresa_contacto` que creó la solicitud) y el técnico asignado
        actual (RN-CH1). Para cualquier otro usuario del tenant, el técnico anterior tras una reasignación, un
        usuario de otro tenant o una solicitud que todavía no ha tenido técnico, responde `404`. Los roles
        `admin_tenant`, `admin_plataforma` y `proveedor` responden `403`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          required: false
          description: Mensajes por página, máximo 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Historial del chat.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagePage'
              example:
                items:
                  - id: 019a0b1c-2d3e-7f40-8a1b-2c3d4e5f6a7b
                    authorId: 9d1e2f3a-4b5c-4d6e-8f7a-0b1c2d3e4f5a
                    authorRole: tecnico
                    text: Llego a las 3 p. m. ¿La portería tiene mi nombre?
                    sentAt: '2026-10-21T17:40:02Z'
                page: 1
                size: 30
                totalItems: 1
                writable: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ChatForbidden'
        '404':
          $ref: '#/components/responses/ChatNotFound'
    post:
      tags: [chat]
      operationId: sendServiceRequestMessage
      summary: Enviar un mensaje al chat de la solicitud
      description: |
        Guarda el mensaje y lo entrega por el canal en tiempo real (trama `chat.message`) al otro participante y a
        las demás conexiones del autor. El autor y su papel en el chat (`cliente` o `tecnico`) salen del JWT y de la
        réplica de la solicitud, nunca del cuerpo. El texto no se escribe en los logs.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              text: Sí, ya le avisé al portero. Es la torre 2.
      responses:
        '201':
          description: Mensaje guardado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ChatForbidden'
        '404':
          $ref: '#/components/responses/ChatNotFound'
        '409':
          description: |
            `chat-cerrado` si la solicitud está en `completado`, `pagado` o `cancelado`, y `chat-no-disponible` si en
            este momento no tiene técnico asignado (RN-CH2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                cerrado:
                  value:
                    type: https://quickpatch.internal/problems/chat-cerrado
                    title: El chat de esta solicitud es de solo lectura
                    status: 409
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por Identity Service con los claims `sub`, `tenant_id` y `role`.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Si no llega, el servicio genera uno y lo devuelve.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Página, desde 1 (DD 8.1).
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: Elementos por página, máximo 100 (DD 8.1).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    CorrelationId:
      description: Identificador de correlación de la petición.
      schema:
        type: string
        format: uuid
  schemas:
    NotificationType:
      type: string
      description: |
        Qué pasó. Cada tipo nace de un evento de `quickpatch-kafka` que Communication ya consume o que este
        contrato le suma; la app ignora los tipos que no conoce (agregar un tipo es un cambio compatible).

        |`type`|Evento|Destinatario|
        |---|---|---|
        |`solicitud-creada`|`service-request.created`|Cliente dueño|
        |`tecnico-asignado`|`service-request.status-changed` de `buscando_tecnico` a `asignado`|Cliente dueño|
        |`solicitud-asignada`|`service-request.status-changed` de `buscando_tecnico` a `asignado`|Técnico asignado|
        |`sin-tecnico-disponible`|`service-request.status-changed` a `en_espera`|Cliente dueño|
        |`busqueda-reanudada`|`service-request.status-changed` de `en_espera` a `buscando_tecnico`|Cliente dueño|
        |`solicitud-cancelada`|`service-request.status-changed` a `cancelado` (1.1.0)|Cliente dueño y, si lo hay, técnico asignado|
        |`cotizacion-recibida`|`service-request.quoted` (1.2.0)|Cliente dueño, con el total y el vencimiento|
        |`cotizacion-aceptada`|`service-request.quote-accepted` (1.2.0)|Técnico asignado: ya puede iniciar|
        |`cotizacion-rechazada`|`service-request.quote-rejected` (1.2.0)|Técnico asignado, con las cotizaciones que le quedan|
        |`oferta-recibida`|`matching.offer-created`|Técnico de la oferta|
        |`registro-recibido`|`technician.registered`|Técnico o proveedor registrado|
        |`verificacion-actualizada`|`technician.verification-changed`|Técnico o proveedor verificado|

        El estado de la solicitud sale de su dueño, ServiceRequest, que publica `status-changed` solo cuando aplicó el
        cambio (SCRUM-466). Los cambios a `cotizado` y `cotizacion_aceptada` no crean notificación de estado: la crea el
        evento de la cotización (1.2.0). El inicio, el cierre y el pago se agregan con sus historias.
        `solicitud-cancelada` no incluye el motivo: la app lo muestra desde el detalle de la solicitud.

        Desde 1.1.0 es `x-extensible-enum`: la lista puede crecer sin romper a los clientes, que ignoran los tipos
        que no conocen.
      x-extensible-enum:
        - solicitud-creada
        - tecnico-asignado
        - solicitud-asignada
        - sin-tecnico-disponible
        - busqueda-reanudada
        - oferta-recibida
        - registro-recibido
        - verificacion-actualizada
        - solicitud-cancelada
        - cotizacion-recibida
        - cotizacion-aceptada
        - cotizacion-rechazada
    Notification:
      type: object
      required: [id, type, title, message, serviceRequestId, createdAt, readAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          maxLength: 100
          description: Título corto para la lista.
        message:
          type: string
          maxLength: 500
          description: Texto para el usuario; sin dirección ni teléfono (RN-SR13).
        serviceRequestId:
          type: string
          format: uuid
          nullable: true
          description: Solicitud relacionada, para abrir su detalle; `null` en los tipos de registro y verificación.
        createdAt:
          type: string
          format: date-time
          description: '`occurredAt` del evento que originó la notificación.'
        readAt:
          type: string
          format: date-time
          nullable: true
          description: Momento en que el usuario la marcó como leída; `null` si no la ha leído.
    NotificationPage:
      type: object
      required: [items, page, size, totalItems, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          description: Total de notificaciones con el filtro pedido.
        unreadCount:
          type: integer
          description: Total de notificaciones sin leer del usuario, sin importar el filtro ni la página.
    ChatMessage:
      type: object
      required: [id, authorId, authorRole, text, sentAt]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        authorRole:
          type: string
          enum: [cliente, tecnico]
          description: Papel del autor en el chat; un `empresa_contacto` dueño escribe como `cliente`.
        text:
          type: string
          minLength: 1
          maxLength: 1000
        sentAt:
          type: string
          format: date-time
          description: Hora del servidor al guardarlo.
    ChatMessagePage:
      type: object
      required: [items, page, size, totalItems, writable]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
        writable:
          type: boolean
          description: Si el usuario del token puede escribir en este momento (RN-CH2).
    SendMessageRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: Texto plano; se quitan los espacios al inicio y al final, y no puede quedar vacío.
    Problem:
      type: object
      description: Detalle de error según RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    ValidationError:
      description: Parámetros inválidos (`problems/validacion`, con `errors` por campo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Falta el JWT o es inválido o expiró (`problems/no-autenticado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El rol del token no tiene buzón (`problems/no-autorizado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: La notificación no existe o no es del usuario (`problems/no-encontrado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ChatForbidden:
      description: El rol del token no participa en chats (`problems/no-autorizado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ChatNotFound:
      description: La solicitud no tiene chat para el usuario del token (`problems/no-encontrado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
