openapi: 3.0.3
info:
  title: QUICKPATCH — Identity API
  version: 1.10.0
  description: |
    Contrato REST de Identity Service (DD, sección 8.2.1): registro de clientes y de técnicos o
    proveedores, inicio de sesión y perfil del usuario autenticado.

    **1.1.0** (compatible): registro de técnico o proveedor, `verificationStatus` en el perfil y `403`
    por tenant inactivo en el registro.

    **1.2.0** (compatible): gestión de tenants por el administrador de la plataforma (RF-21, DD 10.4,
    SCRUM-112): listar los tenants y activarlos o desactivarlos.

    **1.3.0** (compatible): verificación de técnicos y proveedores por el administrador del tenant
    (RF-19, RF-20, DD V4 8.3.13, SCRUM-39 y SCRUM-40): listarlos por estado, aprobarlos, rechazarlos y
    suspenderlos. Cada cambio queda en `audit_logs` y publica `technician.verification-changed`.

    **1.4.0** (compatible): equipo del proveedor (RF-16, DD 8.3.14, SCRUM-36): el `proveedor` da de alta
    técnicos en su equipo y lista su equipo por estado (`activo` o `inactivo`).

    **1.5.0** (compatible): el administrador de la plataforma crea tenants (RF-21, DD 8.2.1, SCRUM-61).

    **1.6.0** (compatible): el registro y el login declaran la cabecera `X-Channel-Id` (DD 8.1, RN-U5,
    DEP-09, SCRUM-60) y la respuesta `503 canal-sin-tenant`, que el servicio ya devolvía.

    **1.7.0** (compatible): invitación del técnico del equipo del proveedor (DD 8.3.14, SCRUM-461). El alta
    devuelve al proveedor un enlace de un solo uso, que vence a las 72 horas, para que el técnico defina su
    contraseña; el proveedor puede generar uno nuevo, y el técnico la define con `POST /v1/auth/password/setup`.
    El correo queda fuera del MVP (ADR-024), así que el proveedor comparte el enlace por el medio que use con su
    técnico.

    **1.8.0** (compatible): cuenta corporativa (RF-06, DD 5.19 y 8.3.18, SCRUM-26 y SCRUM-484). Registro público
    de la empresa cliente con su primer `empresa_contacto`, consulta de la empresa y de sus usuarios, y alta de
    otros usuarios de la empresa con la misma invitación de un solo uso de la 1.7.0. La empresa cliente es una
    cuenta dentro del tenant del canal, no un tenant (DEP-13). `companyId` se agrega al perfil y el token del
    `empresa_contacto` lleva el claim `company_id`.

    **1.9.0** (compatible): edición del perfil propio (SCRUM-609 y SCRUM-610, retroalimentación del Sprint 4):
    `PATCH /v1/users/me` actualiza `fullName` y `phone` del usuario del token. El correo, el rol, el tenant y el
    estado de verificación no se editan.

    **1.10.0** (compatible): recuperación de la contraseña olvidada (SCRUM-623 y SCRUM-624). El correo sigue fuera
    del MVP (ADR-024), así que el enlace lo entrega el administrador del tenant, con el mismo mecanismo de la
    invitación de la 1.7.0: el usuario lo pide con su correo (`POST /v1/auth/password-recovery`), el `admin_tenant`
    ve las solicitudes pendientes (`GET /v1/admin/password-recovery-requests`), genera un enlace de un solo uso que
    vence en **1 hora** (`POST /v1/admin/password-recovery-requests/{id}/link`) y se lo hace llegar al usuario por el
    medio que use con él, después de confirmar que es quien lo pidió. El usuario define la contraseña nueva con
    `POST /v1/auth/password-recovery/confirm`.

    - **Proveedor:** Identity Service.
    - **Consumidores:** app móvil Flutter, panel Angular y API Gateway.
    - **Tenant:** en el registro y el login se resuelve a partir del canal (`X-Channel-Id`) por el que llega
      la petición (RN-U5, DD 10.3), nunca de un campo del cuerpo. Identity tiene configurado a qué tenant
      apunta cada canal; sin cabecera se usa el tenant de la instancia.
    - **Token:** JWT firmado con RS256 por Identity. Claims: `sub` (id del usuario), `tenant_id`, `role`,
      `iss`, `aud`, `exp`; el de un `empresa_contacto` también `company_id` (1.8.0). Los demás servicios lo
      validan con la llave pública de Identity.
    - Los errores se devuelven como `application/problem+json` (RFC 9457).
  contact:
    name: Equipo QUICKPATCH
    url: https://github.com/ARQUI-202630/quickpatch
servers:
  - url: https://quickpatch.internal/api
    description: Producción, detrás del API Gateway (VM1), que quita el prefijo /api
  - url: https://qa.quickpatch.internal/api
    description: Ambiente de QA (VM2, ADR-015)
tags:
  - name: auth
    description: Registro e inicio de sesión.
  - name: users
    description: Perfil del usuario autenticado.
  - name: platform
    description: Operaciones de plataforma, solo para `admin_plataforma` (DD 10.4).
  - name: technicians-admin
    description: Verificación de técnicos y proveedores, solo para `admin_tenant` y sobre su propio tenant.
  - name: provider-team
    description: Equipo de técnicos del proveedor, solo para `proveedor` y sobre su propio equipo (RN-TP4).
  - name: companies
    description: Cuenta corporativa (empresa cliente), solo para `empresa_contacto` y sobre su propia empresa (RN-CC3).
  - name: password-recovery-admin
    description: Solicitudes de recuperación de contraseña de los usuarios del tenant, solo para `admin_tenant` (1.10.0).
paths:
  /v1/auth/register/client:
    post:
      tags: [auth]
      operationId: registerClient
      summary: Registrar un cliente
      description: |
        Crea un usuario con rol `cliente` en el tenant del canal (RF-01). El correo es único dentro del
        tenant (RN-U1) y la contraseña se guarda con un hash BCrypt (RN-U2, RNF-03). No inicia sesión.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
      responses:
        '201':
          description: Cliente registrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/TenantDisabled'
        '409':
          description: El correo ya está registrado en el tenant (`problems/correo-registrado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ChannelWithoutTenant'
  /v1/auth/register/technician:
    post:
      tags: [auth]
      operationId: registerTechnician
      summary: Registrar un técnico o un proveedor
      description: |
        Crea un usuario con rol `tecnico` o `proveedor` en el tenant del canal y su perfil en estado
        `pendiente` de verificación (RF-02, DD 5.3). Un administrador del tenant lo aprueba después (RF-19).
        El documento de identidad es obligatorio y único dentro del tenant. `specialtyId` es una categoría
        de servicio de Catalog (referencia lógica, propuesta P-03 del DD). No inicia sesión.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTechnicianRequest'
      responses:
        '201':
          description: Técnico o proveedor registrado, pendiente de verificación.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/TenantDisabled'
        '409':
          description: El correo (`problems/correo-registrado`) o el documento (`problems/documento-registrado`) ya están registrados en el tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ChannelWithoutTenant'
  /v1/auth/register/company:
    post:
      tags: [auth]
      operationId: registerCompany
      summary: Registrar una cuenta corporativa
      description: |
        Crea la empresa cliente (`client_companies`) y su primer usuario con rol `empresa_contacto` en el tenant
        del canal, en una sola transacción (RF-06, DD 8.3.18). La empresa es una cuenta dentro del tenant: no
        se crea un tenant (DEP-13). El NIT es único dentro del tenant (RN-CC1) y el correo del usuario también
        (RN-U1). El usuario define su contraseña aquí; los demás usuarios de la empresa entran por invitación
        (`POST /v1/companies/me/users`). No inicia sesión.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyRequest'
            example:
              company:
                legalName: Inversiones Andinas S.A.S.
                nit: 900123456-7
                contactEmail: mantenimiento@andinas.com.co
                contactPhone: '+5716012345'
              user:
                email: laura.mora@andinas.com.co
                password: Contrasena-segura-1
                fullName: Laura Mora
                phone: '+573001112233'
      responses:
        '201':
          description: Empresa y primer usuario registrados.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRegistered'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/TenantDisabled'
        '409':
          description: El NIT (`problems/nit-registrado`) o el correo (`problems/correo-registrado`) ya están registrados en el tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ChannelWithoutTenant'
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión
      description: |
        Verifica el correo y la contraseña en el tenant del canal (RF-03). Tras 5 intentos fallidos
        consecutivos la cuenta queda bloqueada 15 minutos (RN-U4, AC6-E8): el quinto fallo y cualquier
        intento durante el bloqueo responden `423`. Un usuario de un tenant inactivo recibe `403` (RN-T1).
        Correo inexistente y contraseña incorrecta responden igual (`401`), para no revelar qué correos existen.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credenciales inválidas (`problems/credenciales-invalidas`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: El tenant del usuario está inactivo (`problems/tenant-inactivo`, detalle `tenant is disabled`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Cuenta bloqueada temporalmente (`problems/cuenta-bloqueada`).
          headers:
            Retry-After:
              description: Segundos que faltan para que termine el bloqueo.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ChannelWithoutTenant'
  /v1/auth/password/setup:
    post:
      tags: [auth]
      operationId: setupPassword
      summary: Definir la contraseña con una invitación
      description: |
        El técnico del equipo de un proveedor (DD 8.3.14) o el usuario agregado a una empresa cliente (DD 8.3.18,
        desde la 1.8.0) define su contraseña con el token de su invitación.
        El tenant sale del canal (`X-Channel-Id`, RN-U5), igual que en el login. El token sirve una sola vez y
        vence a las 72 horas; usado, vencido, anulado o de otro tenant responde igual (`400 enlace-invalido`),
        para no revelar cuál fue el caso. No inicia sesión: después el técnico entra con `POST /v1/auth/login`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupRequest'
      responses:
        '204':
          description: Contraseña definida.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          description: |
            La contraseña no cumple la política (`problems/validacion`, en `errors.password`) o el enlace no es
            válido (`problems/enlace-invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/TenantDisabled'
        '503':
          $ref: '#/components/responses/ChannelWithoutTenant'
  /v1/auth/password-recovery:
    post:
      tags: [auth]
      operationId: requestPasswordRecovery
      summary: Pedir la recuperación de la contraseña
      description: |
        El usuario que olvidó su contraseña la pide con su correo (SCRUM-623). El tenant sale del canal
        (`X-Channel-Id`, RN-U5), igual que en el login. Desde 1.10.0.

        - **Misma respuesta siempre:** `202` exista o no la cuenta, para no revelar quién está registrado.
        - **Qué registra:** si la cuenta existe, está activa y no es `admin_tenant` ni `admin_plataforma`, deja una
          solicitud `pendiente` para el `admin_tenant` del tenant. Si ya tenía una pendiente, no crea otra: actualiza
          su fecha. No genera ningún token: el enlace lo genera el administrador.
        - **Límite:** 3 solicitudes por correo por hora, cuente o no con una cuenta; la cuarta responde `429` con
          `Retry-After`. El límite es por correo y no por cuenta para que tampoco revele quién está registrado.
        - **Administradores:** la contraseña de un `admin_tenant` la recupera el `admin_plataforma`, fuera de este
          flujo.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '202':
          description: Solicitud recibida. El cuerpo es el mismo exista o no la cuenta.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/TenantDisabled'
        '429':
          description: Más de 3 solicitudes para el mismo correo en una hora (`problems/demasiadas-solicitudes`).
          headers:
            Retry-After:
              description: Segundos que faltan para poder pedirla otra vez.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ChannelWithoutTenant'
  /v1/auth/password-recovery/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordRecovery
      summary: Definir la contraseña nueva con el enlace de recuperación
      description: |
        El usuario define su contraseña nueva con el token del enlace que le entregó el administrador. El tenant sale
        del canal (`X-Channel-Id`, RN-U5). Desde 1.10.0.

        - **Token:** de un solo uso, vence a la hora. Usado, vencido, anulado o de otro tenant responde igual
          (`400 enlace-invalido`), para no revelar cuál fue el caso. Va en el cuerpo, no en la ruta, para que no
          quede en los registros del Gateway.
        - **Contraseña:** misma política del registro (RF-01, mínimo 8 caracteres).
        - **Efecto:** guarda el hash nuevo, cierra la solicitud, anula los demás enlaces de recuperación del usuario y
          desbloquea la cuenta si estaba bloqueada por intentos fallidos (RN-U4). No inicia sesión: después el
          usuario entra con `POST /v1/auth/login`.
        - **Sesiones abiertas:** el login rechaza la contraseña anterior desde ese momento, pero los tokens ya
          emitidos siguen sirviendo hasta que vencen (`expiresIn`), porque los servicios validan el JWT con la llave
          pública sin consultar a Identity (ADR-018). Es el mismo criterio de RN-T1 para un tenant desactivado.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupRequest'
      responses:
        '204':
          description: Contraseña nueva guardada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          description: |
            La contraseña no cumple la política (`problems/validacion`, en `errors.password`) o el enlace no es
            válido (`problems/enlace-invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/TenantDisabled'
        '503':
          $ref: '#/components/responses/ChannelWithoutTenant'
  /v1/users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Consultar el perfil propio
      description: Devuelve el perfil del usuario del token, para cualquier rol.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Falta el JWT o es inválido o expiró.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [users]
      operationId: updateCurrentUser
      summary: Actualizar el perfil propio
      description: |
        Actualiza nombre y teléfono del usuario del token (SCRUM-609). El backend modifica solo al usuario
        autenticado, usando su tenant del JWT. No acepta id, email, role, tenant_id ni verificationStatus.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 150
                phone:
                  type: string
                  minLength: 7
                  maxLength: 30
                  nullable: true
      responses:
        '200':
          description: Perfil actualizado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/platform/tenants:
    get:
      tags: [platform]
      operationId: listTenants
      summary: Listar los tenants de la plataforma
      description: |
        Devuelve todos los tenants, activos e inactivos, ordenados por nombre (RF-21). Solo
        `admin_plataforma` (RN-U6); es una operación de plataforma que no está limitada al tenant del token
        (DD 10.4).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenants de la plataforma.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [platform]
      operationId: createTenant
      summary: Crear un tenant
      description: |
        Crea una empresa oferente en estado `activo` (RF-21, DD 5.1). Solo `admin_plataforma` (RN-U6). El NIT
        es único en la plataforma. La creación queda en `audit_logs` (`crear_tenant`) con el responsable.
        No crea usuarios ni el canal del tenant: el canal se configura en el despliegue (RN-U5, DEP-09).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            example:
              name: Servicios Técnicos Andinos S.A.S.
              nit: 900123456-7
      responses:
        '201':
          description: Tenant creado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe un tenant con ese NIT (`problems/nit-registrado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/platform/tenants/{id}:
    patch:
      tags: [platform]
      operationId: updateTenantStatus
      summary: Activar o desactivar un tenant
      description: |
        Cambia el estado del tenant (RF-21). Un tenant inactivo no puede registrar usuarios ni iniciar
        sesión (RN-T1). La operación queda registrada en `audit_logs` (DD 10.4). El tenant del propio
        administrador de la plataforma no se puede desactivar. Solo `admin_plataforma`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantStatusRequest'
      responses:
        '200':
          description: Tenant con el estado nuevo. Repetir el mismo estado no es un error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El tenant no existe (`problems/no-encontrado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Se intentó desactivar el tenant de la plataforma (`problems/tenant-plataforma`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/admin/technicians:
    get:
      tags: [technicians-admin]
      operationId: listTechnicians
      summary: Listar los técnicos y proveedores del tenant
      description: |
        Devuelve los técnicos y proveedores del tenant del token, opcionalmente filtrados por estado de
        verificación, del más antiguo al más reciente (RF-19, SCRUM-39 criterio 1). Solo `admin_tenant`;
        nunca devuelve técnicos de otro tenant (RLS, SCRUM-39 criterio 7).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: verificationStatus
          in: query
          required: false
          description: Filtra por estado de verificación. Sin el parámetro devuelve todos.
          schema:
            $ref: '#/components/schemas/VerificationStatus'
        - name: page
          in: query
          required: false
          description: Página, desde 1 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Elementos por página, máximo 100 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Técnicos y proveedores del tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/technicians/{userId}/approve:
    post:
      tags: [technicians-admin]
      operationId: approveTechnician
      summary: Aprobar un técnico o proveedor
      description: |
        Pasa el técnico a `aprobado` desde `pendiente`, `rechazado` (nueva revisión) o `suspendido`
        (reactivación), según la tabla del DD 8.3.13. No lleva cuerpo. Solo `admin_tenant` y sobre su tenant.
        Queda en `audit_logs` (`aprobar_tecnico`) y publica `technician.verification-changed`; desde ese
        momento el técnico es candidato del matching (RN-TP1).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TechnicianUserId'
      responses:
        '200':
          $ref: '#/components/responses/VerificationChanged'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TechnicianNotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /v1/admin/technicians/{userId}/reject:
    post:
      tags: [technicians-admin]
      operationId: rejectTechnician
      summary: Rechazar un técnico o proveedor
      description: |
        Pasa el técnico de `pendiente` a `rechazado`, con motivo obligatorio (RF-19, SCRUM-39 criterio 2).
        Solo `admin_tenant` y sobre su tenant. Queda en `audit_logs` (`rechazar_tecnico`) y publica
        `technician.verification-changed`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TechnicianUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationReasonRequest'
            example:
              reason: El documento de identidad no es legible.
      responses:
        '200':
          $ref: '#/components/responses/VerificationChanged'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TechnicianNotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /v1/admin/technicians/{userId}/suspend:
    post:
      tags: [technicians-admin]
      operationId: suspendTechnician
      summary: Suspender un técnico o proveedor
      description: |
        Pasa el técnico de `aprobado` a `suspendido`, con motivo obligatorio (RF-20, SCRUM-40). Solo
        `admin_tenant` y sobre su tenant. La fecha y el responsable quedan en `audit_logs`
        (`suspender_tecnico`) y se publica `technician.verification-changed`. Un servicio en curso no se
        interrumpe (RN-TP2).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TechnicianUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationReasonRequest'
            example:
              reason: Reclamos repetidos por incumplimiento de citas.
      responses:
        '200':
          $ref: '#/components/responses/VerificationChanged'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TechnicianNotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /v1/admin/password-recovery-requests:
    get:
      tags: [password-recovery-admin]
      operationId: listPasswordRecoveryRequests
      summary: Listar las solicitudes de recuperación pendientes del tenant
      description: |
        Solicitudes `pendiente` de los usuarios del tenant del token, de la más antigua a la más reciente. Solo
        `admin_tenant`; nunca devuelve usuarios de otro tenant (RLS). Desde 1.10.0.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          required: false
          description: Página, desde 1 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Elementos por página, máximo 100 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Solicitudes pendientes.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryRequestPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/password-recovery-requests/{id}/link:
    post:
      tags: [password-recovery-admin]
      operationId: createPasswordRecoveryLink
      summary: Generar el enlace de recuperación de una solicitud
      description: |
        Genera un enlace de un solo uso que vence en 1 hora y anula los enlaces de recuperación anteriores del
        usuario que no se hayan usado. Solo `admin_tenant` y sobre solicitudes de su tenant: una de otro tenant
        responde `404`. El enlace solo se muestra en esta respuesta (Identity guarda el hash del token); el
        administrador lo entrega al usuario después de confirmar que es quien lo pidió. Puede volver a generarlo
        mientras la solicitud siga pendiente. Queda en `audit_logs`. Desde 1.10.0.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: Identificador de la solicitud de recuperación.
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Enlace nuevo, con el mismo formato de la invitación.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
              example:
                link: https://quickpatch.internal/recuperar#token=Rk3pX2q9ZbT7vW1sYc8nLm4dHa6uJe0oQi5gNt-yUfB
                token: Rk3pX2q9ZbT7vW1sYc8nLm4dHa6uJe0oQi5gNt-yUfB
                expiresAt: '2026-10-29T15:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La solicitud no existe en el tenant del administrador (`problems/no-encontrado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: La solicitud ya se cerró porque el usuario definió su contraseña (`problems/transicion-invalida`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/providers/me/technicians:
    post:
      tags: [provider-team]
      operationId: createProviderTechnician
      summary: Dar de alta un técnico en el equipo del proveedor
      description: |
        Crea un usuario con rol `tecnico` en el tenant del proveedor, con `provider_id` igual al proveedor
        del token y su perfil en `pendiente` (RF-16, RN-TP3, DD 8.3.14). Igual que cualquier técnico, solo
        participa en el matching cuando el `admin_tenant` lo aprueba (RN-TP1). Publica
        `technician.registered` con `providerId`. Valida el documento y el correo igual que el registro
        (únicos dentro del tenant).

        El técnico se crea **sin contraseña utilizable**: no puede iniciar sesión hasta que la defina con la
        invitación (`invitation`) que trae la respuesta. Es la única vez que el enlace se muestra: Identity solo
        guarda su hash. Vence a las 72 horas y sirve una sola vez; si el técnico lo pierde, el proveedor genera
        otro con `POST /v1/providers/me/technicians/{userId}/invitation`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderTechnicianRequest'
            example:
              email: carlos.ruiz@example.com
              fullName: Carlos Ruiz
              phone: '+573001234567'
              documentId: '1020304050'
              specialtyId: 6c1f3d0a-2b7e-4f51-9a3c-6e0d2b8f4a10
      responses:
        '201':
          description: Técnico creado en el equipo del proveedor, pendiente de verificación, con su invitación.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTechnicianCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: El rol del token no es `proveedor` (`problems/no-autorizado`) o el tenant está inactivo (`problems/tenant-inactivo`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: El correo (`problems/correo-registrado`) o el documento (`problems/documento-registrado`) ya están registrados en el tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [provider-team]
      operationId: listProviderTechnicians
      summary: Listar el equipo del proveedor
      description: |
        Devuelve solo los técnicos cuyo `provider_id` es el proveedor del token (RN-TP4), del más antiguo al
        más reciente (RF-16, DD 8.3.14). `activo` son los aprobados; `inactivo`, los pendientes, rechazados
        o suspendidos. La disponibilidad vive en Matching Service y no se incluye en el MVP (DEP-19).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          description: Filtra por `activo` o `inactivo`. Sin el parámetro devuelve todo el equipo.
          schema:
            type: string
            enum: [activo, inactivo]
        - name: page
          in: query
          required: false
          description: Página, desde 1 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Elementos por página, máximo 100 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Técnicos del equipo del proveedor.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTechnicianPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/providers/me/technicians/{userId}/invitation:
    post:
      tags: [provider-team]
      operationId: renewProviderTechnicianInvitation
      summary: Generar una invitación nueva para un técnico del equipo
      description: |
        Genera un enlace nuevo para que el técnico defina su contraseña (DD 8.3.14) y anula los anteriores que
        no se hayan usado. Solo para técnicos del equipo del proveedor del token (RN-TP4): un técnico de otro
        proveedor o de otro tenant responde `404`. Si el técnico ya definió su contraseña responde `409`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TechnicianUserId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Invitación nueva.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El técnico no es del equipo del proveedor (`problems/no-encontrado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: El técnico ya definió su contraseña (`problems/contrasena-definida`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/companies/me:
    get:
      tags: [companies]
      operationId: getMyCompany
      summary: Consultar la empresa propia
      description: Devuelve la empresa cliente del `company_id` del token (DD 8.3.18).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Empresa del usuario.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/companies/me/users:
    post:
      tags: [companies]
      operationId: createCompanyUser
      summary: Agregar un usuario a la empresa
      description: |
        Crea un usuario con rol `empresa_contacto` en el tenant y la empresa del token (RN-CC3, DD 8.3.18); el
        cuerpo no lleva ni el tenant ni la empresa. El correo es único dentro del tenant (RN-U1).

        El usuario se crea **sin contraseña utilizable** y la respuesta trae su invitación, igual que el equipo
        del proveedor (1.7.0): un enlace de un solo uso que vence a las 72 horas y que solo se muestra esta vez.
        Si se pierde, se genera otro con `POST /v1/companies/me/users/{userId}/invitation`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUserRequest'
            example:
              email: andres.pena@andinas.com.co
              fullName: Andrés Peña
              phone: '+573004445566'
      responses:
        '201':
          description: Usuario agregado a la empresa, con su invitación.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyUserCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: El rol del token no es `empresa_contacto` (`problems/no-autorizado`) o el tenant está inactivo (`problems/tenant-inactivo`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: El correo ya está registrado en el tenant (`problems/correo-registrado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [companies]
      operationId: listCompanyUsers
      summary: Listar los usuarios de la empresa
      description: |
        Devuelve solo los usuarios de la empresa del token (RN-CC3), del más antiguo al más reciente.
        `passwordDefined` es falso mientras el usuario no haya usado su invitación.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          required: false
          description: Página, desde 1 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Elementos por página, máximo 100 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Usuarios de la empresa.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyUserPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/companies/me/users/{userId}/invitation:
    post:
      tags: [companies]
      operationId: renewCompanyUserInvitation
      summary: Generar una invitación nueva para un usuario de la empresa
      description: |
        Genera un enlace nuevo y anula los anteriores sin usar (DD 8.3.18). Solo para usuarios de la empresa del
        token: uno de otra empresa o de otro tenant responde `404`. Si el usuario ya definió su contraseña
        responde `409`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyUserId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Invitación nueva.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El usuario no es de la empresa (`problems/no-encontrado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: El usuario ya definió su contraseña (`problems/contrasena-definida`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por este servicio con los claims `sub`, `tenant_id` y `role`, y `company_id` para `empresa_contacto`.
  parameters:
    ChannelId:
      name: X-Channel-Id
      in: header
      required: false
      description: |
        Canal de la app o del panel (por ejemplo `quickpatch-mobile`) en las peticiones sin token. Identity lo
        traduce al tenant con su configuración; el Gateway la sobrescribe y no la acepta del cliente (DD 8.1).
        Sin cabecera se usa el tenant de la instancia.
      schema:
        type: string
        maxLength: 100
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Si no llega, el servicio genera uno y lo devuelve.
      schema:
        type: string
        format: uuid
    TechnicianUserId:
      name: userId
      in: path
      required: true
      description: Identificador del usuario técnico o proveedor (`users.id`).
      schema:
        type: string
        format: uuid
    CompanyUserId:
      name: userId
      in: path
      required: true
      description: Identificador del usuario de la empresa (`users.id`).
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      description: Identificador de correlación de la petición.
      schema:
        type: string
        format: uuid
  schemas:
    Role:
      type: string
      description: Rol del usuario (DD, sección 5.2).
      enum: [cliente, tecnico, proveedor, empresa_contacto, admin_tenant, admin_plataforma]
    RegisterClientRequest:
      type: object
      required: [email, password, fullName]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          maxLength: 30
          nullable: true
    RegisterTechnicianRequest:
      type: object
      required: [email, password, fullName, phone, documentId, specialtyId, role]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          minLength: 7
          maxLength: 30
        documentId:
          type: string
          minLength: 5
          maxLength: 30
          description: Documento de identidad; único dentro del tenant.
        specialtyId:
          type: string
          format: uuid
          description: Categoría de servicio que atiende (Catalog).
        role:
          type: string
          enum: [tecnico, proveedor]
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          maxLength: 128
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT RS256.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Segundos de vigencia del token.
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        phone:
          type: string
          nullable: true
        verificationStatus:
          type: string
          nullable: true
          enum: [pendiente, aprobado, rechazado, suspendido, null]
          description: Solo para `tecnico` y `proveedor` (DD 5.3); `null` en los demás roles.
        companyId:
          type: string
          format: uuid
          nullable: true
          description: Desde la 1.8.0. Empresa cliente del `empresa_contacto` (RN-CC2); `null` en los demás roles.
    TenantStatus:
      type: string
      description: Estado del tenant (DD, tabla `tenants`).
      enum: [activo, inactivo]
    Tenant:
      type: object
      required: [id, name, nit, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nit:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        createdAt:
          type: string
          format: date-time
    CreateTenantRequest:
      type: object
      required: [name, nit]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          description: Nombre de la empresa oferente.
        nit:
          type: string
          minLength: 5
          maxLength: 30
          pattern: '^[0-9]+(-[0-9])?$'
          description: NIT con dígito de verificación opcional (por ejemplo `900123456-7`); único en la plataforma.
    UpdateTenantStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/TenantStatus'
    VerificationStatus:
      type: string
      description: Estado de verificación del técnico (DD 5.3).
      enum: [pendiente, aprobado, rechazado, suspendido]
    AdminTechnician:
      type: object
      required: [userId, fullName, email, role, documentId, specialtyId, verificationStatus, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [tecnico, proveedor]
        documentId:
          type: string
          description: Documento de identidad, para que el administrador lo verifique.
        specialtyId:
          type: string
          format: uuid
          description: Categoría de servicio que atiende (Catalog).
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        verificationReason:
          type: string
          nullable: true
          description: Motivo del último rechazo o suspensión.
        createdAt:
          type: string
          format: date-time
    TechnicianPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminTechnician'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    VerificationReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: Motivo del rechazo o la suspensión; lo ve el técnico.
    TechnicianVerification:
      type: object
      required: [userId, verificationStatus, reason]
      properties:
        userId:
          type: string
          format: uuid
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        reason:
          type: string
          nullable: true
          description: Motivo; `null` al aprobar.
    ProviderTechnicianRequest:
      type: object
      description: Mismo cuerpo que el registro de técnico, sin `password` ni `role` (DD 8.3.14).
      required: [email, fullName, phone, documentId, specialtyId]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          minLength: 7
          maxLength: 30
        documentId:
          type: string
          minLength: 5
          maxLength: 30
          description: Documento de identidad; único dentro del tenant.
        specialtyId:
          type: string
          format: uuid
          description: Categoría de servicio que atiende (Catalog).
    ProviderTechnician:
      type: object
      required: [userId, fullName, specialtyId, verificationStatus]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        specialtyId:
          type: string
          format: uuid
          description: Categoría de servicio que atiende (Catalog).
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
    ProviderTechnicianPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderTechnician'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    Invitation:
      type: object
      description: |
        Invitación para que un técnico del equipo o un usuario de la empresa defina su contraseña. El token va después de `#` en el enlace,
        así no llega a los registros de los servidores web cuando se abre.
      required: [link, token, expiresAt]
      properties:
        link:
          type: string
          format: uri
          description: Enlace que el proveedor comparte con el técnico; la app lo abre en la pantalla de contraseña.
          example: https://quickpatch.internal/activar#token=3q2-7wEAAAAAbm90LWEtcmVhbC10b2tlbi1qdXN0LWFu
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Token de un solo uso (256 bits en base64url). Identity solo guarda su hash.
        expiresAt:
          type: string
          format: date-time
    ProviderTechnicianCreated:
      description: Perfil del técnico creado y su invitación.
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          required: [invitation]
          properties:
            invitation:
              $ref: '#/components/schemas/Invitation'
    RegisterCompanyRequest:
      type: object
      required: [company, user]
      additionalProperties: false
      properties:
        company:
          $ref: '#/components/schemas/CompanyData'
        user:
          $ref: '#/components/schemas/RegisterClientRequest'
    CompanyData:
      type: object
      required: [legalName, nit, contactEmail]
      additionalProperties: false
      properties:
        legalName:
          type: string
          minLength: 2
          maxLength: 150
          description: Razón social.
        nit:
          type: string
          pattern: '^[0-9]{5,15}(-[0-9])?$'
          maxLength: 30
          description: NIT con o sin dígito de verificación (`900123456-7`); único dentro del tenant (RN-CC1).
        contactEmail:
          type: string
          format: email
          maxLength: 150
          description: Correo de contacto corporativo.
        contactPhone:
          type: string
          maxLength: 30
          nullable: true
    Company:
      type: object
      required: [id, legalName, nit, contactEmail, createdAt]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        nit:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    CompanyRegistered:
      type: object
      required: [company, user]
      properties:
        company:
          $ref: '#/components/schemas/Company'
        user:
          $ref: '#/components/schemas/UserProfile'
    CompanyUserRequest:
      type: object
      required: [email, fullName]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          maxLength: 30
          nullable: true
    CompanyUser:
      type: object
      required: [userId, email, fullName, passwordDefined, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        passwordDefined:
          type: boolean
          description: Falso mientras el usuario no haya usado su invitación.
        createdAt:
          type: string
          format: date-time
    CompanyUserPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyUser'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    CompanyUserCreated:
      description: Perfil del usuario agregado y su invitación.
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          required: [invitation]
          properties:
            invitation:
              $ref: '#/components/schemas/Invitation'
    PasswordRecoveryRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 150
    PasswordRecoveryPending:
      type: object
      description: Solicitud de recuperación pendiente. No lleva ningún token.
      required: [id, userId, email, fullName, role, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        requestedAt:
          type: string
          format: date-time
          description: Última vez que el usuario la pidió.
    PasswordRecoveryRequestPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PasswordRecoveryPending'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    PasswordSetupRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 100
          description: Token de la invitación o, desde 1.10.0, del enlace de recuperación.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    Problem:
      type: object
      description: Detalle de error según RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    ChannelWithoutTenant:
      description: |
        El canal no tiene un tenant configurado (`problems/canal-sin-tenant`): la cabecera `X-Channel-Id`
        trae un canal que no está en la configuración de Identity, o la instancia no tiene tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Falta el JWT o es inválido o expiró (`problems/no-autenticado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El rol del token no puede hacer esta operación (`problems/no-autorizado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TenantDisabled:
      description: El tenant del canal está inactivo (`problems/tenant-inactivo`, detalle `tenant is disabled`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Datos de entrada inválidos (`problems/validacion`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TechnicianNotFound:
      description: El técnico no existe en el tenant del administrador (`problems/no-encontrado`); un técnico de otro tenant responde igual (RN-U6).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidTransition:
      description: El estado actual del técnico no admite la acción según la tabla del DD 8.3.13 (`problems/transicion-invalida`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VerificationChanged:
      description: Estado de verificación nuevo.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TechnicianVerification'
