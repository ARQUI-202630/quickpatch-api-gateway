openapi: 3.0.3
info:
  title: QUICKPATCH — Payments API
  version: 1.2.0
  description: |
    Contrato REST de Payments Service (DD, sección 8.1): procesa pagos de solicitudes de servicio
    y lista pagos recibidos por técnicos.

    **1.0.0** (compatible): crear pago, listar pagos del servicio, consultar detalles y comprobante.
    **1.1.0** (compatible): comprobante en JSON o PDF según `Accept`.
    **1.2.0** (compatible): listado de pagos recibidos por técnico autenticado (RF-25, SCRUM-500).

    - **Proveedor:** Payments Service.
    - **Consumidores:** app móvil, panel web y API Gateway.
    - El tenant, el usuario autenticado y la empresa se toman de los claims del JWT
      (`tenant_id`, `sub`, `company_id`); nunca del cuerpo de la petición.
    - Los errores se devuelven como `application/problem+json` (RFC 9457).
  contact:
    name: Equipo QUICKPATCH
    url: https://github.com/ARQUI-202630/quickpatch
servers:
  - url: https://quickpatch.internal/api
    description: Producción, detrás del API Gateway (VM1), que quita el prefijo /api
  - url: https://qa.quickpatch.internal/api
    description: Ambiente de QA (VM2, ADR-015)
tags:
  - name: payments
    description: Pagos de solicitudes de servicio.
paths:
  /v1/payments/received:
    get:
      tags: [payments]
      operationId: listReceivedPayments
      summary: Listar pagos recibidos por el técnico
      description: |
        Técnico lista los pagos aprobados de sus servicios completados (RF-25, SCRUM-500).
        Solo el rol `tecnico`. Desde 1.2.0.

        - **Quién:** solo el técnico autenticado. El cliente, el admin y otros roles responden `403`.
        - **Qué:** solo pagos con `status = aprobado` en los servicios completados del técnico.
        - **Orden:** más reciente a más antigua (por `approvedAt`).
        - **Índice:** (DD 5.13) índice compuesto sobre `technician_id, status` para esta consulta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          required: false
          description: Página, desde 1 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Elementos por página, máximo 100 (DD 8.1).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Pagos recibidos del técnico.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedPaymentPage'
              example:
                items:
                  - id: a1b2c3d4-e5f6-47g8-h9i0-j1k2l3m4n5o6
                    serviceRequestId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    amount: 125000
                    currency: COP
                    status: aprobado
                    approvedAt: '2026-10-20T14:30:00Z'
                page: 1
                size: 20
                totalItems: 15
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por Identity Service con los claims `sub`, `tenant_id` y `role`.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Si no llega, el servicio genera uno y lo devuelve.
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      description: Identificador de correlación de la petición.
      schema:
        type: string
        format: uuid
  schemas:
    ReceivedPayment:
      type: object
      description: Pago aprobado de un servicio completado (DD 5.13, RF-25). Desde 1.2.0.
      required: [id, serviceRequestId, amount, currency, status, approvedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del pago.
        serviceRequestId:
          type: string
          format: uuid
          description: Solicitud de servicio para la que se registró el pago.
        amount:
          type: integer
          minimum: 0
          description: Monto en la menor unidad de la moneda (centavos para COP).
        currency:
          type: string
          enum: [COP]
          description: Moneda del pago.
        status:
          type: string
          enum: [aprobado]
          description: Estado del pago. En esta lista solo aparecen pagos aprobados.
        approvedAt:
          type: string
          format: date-time
          description: Timestamp de cuándo el pago fue aprobado por el gateway.
    ReceivedPaymentPage:
      type: object
      description: Página de pagos recibidos (DD 8.1).
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedPayment'
        page:
          type: integer
          description: Número de página actual.
        size:
          type: integer
          description: Cantidad de elementos en esta página.
        totalItems:
          type: integer
          description: Total de elementos disponibles.
    Problem:
      type: object
      description: Detalle de error según RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    ValidationError:
      description: Datos de entrada inválidos (`problems/validacion`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Falta el JWT o es inválido o expiró.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El usuario no tiene permiso para este recurso (`problems/acceso-denegado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
